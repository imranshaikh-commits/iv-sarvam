# =====================================================
# SHILPI (product name) — Production stack
# =====================================================
# Internal Docker identifiers below (container_name, service key, project
# `name:`, env_file path) intentionally KEPT as "sarvam" — legacy internal
# codename. They are invisible to end users; renaming them would risk
# breaking Open WebUI's stored connection to the brain for zero visible
# benefit. Only the user-facing WEBUI_NAME changed.
# Runs on EC2 sarvam-server (13.206.20.25).
# Usage:  cd ~/iv-sarvam/deploy && docker compose up -d --build
#
# open-webui volume is the PRE-EXISTING named volume from Day 1
# (declared external) — admin accounts, chats, branding preserved.
#
# sarvam-brain (Sprint 4): OpenAI-compatible grounded drafting service.
# NOT exposed publicly — Open WebUI reaches it at http://sarvam-brain:8000/v1
# on the compose network; host port bound to 127.0.0.1 for local testing only.

name: sarvam

# Rotate container logs: they had no limit, and until 2026-09-28 the brain
# wrote client text into them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  open-webui:
    # Thin custom image (deploy/Dockerfile.webui) that strips Open WebUI's
    # forced " (Open WebUI)" brand suffix so WEBUI_NAME shows cleanly.
    build:
      context: .
      dockerfile: Dockerfile.webui
    container_name: sarvam-webui
    restart: always
    # Branding — persistent across rebuilds (was lost in the Sprint 3
    # docker-run -> compose migration because it was only a runtime env var).
    environment:
      - "WEBUI_NAME=Shilpi AI - Inspirit Vision Proposal Architect"
      - "WEBUI_FAVICON_URL=/static/favicon.png"
    # Not published to the internet any more: colleagues reach Open WebUI
    # through Caddy over HTTPS (below). Loopback only, for an SSH-tunnel fallback.
    ports:
      - "127.0.0.1:8080:8080"
    logging: *default-logging
    volumes:
      - open-webui:/app/backend/data

  sarvam-brain:
    build: ../backend/brain
    container_name: sarvam-brain
    restart: always
    env_file:
      - ../scripts/sarvam.env
    ports:
      - "127.0.0.1:8000:8000"
    logging: *default-logging
    volumes:
      # Open WebUI's data volume, READ-ONLY.
      #
      # When a consultant attaches an RFP in chat, OWUI stores the file at
      # /app/backend/data/uploads/{uuid}_{name} and sends the brain only the
      # text it managed to extract itself. For a raster tender that is nothing:
      # the 20-page ESNAD SOW yielded 468 characters, all page numbers. The
      # brain therefore reads the real file from OWUI's own storage.
      #
      # READ-ONLY is deliberate. The brain has no business writing here, and a
      # bug that corrupted webui.db would take the whole frontend down --
      # including the stored connection to this service.
      - open-webui:/owui-data:ro

  # HTTPS front door. Caddy obtains and renews a Let's Encrypt certificate for
  # SHILPI_DOMAIN by itself (ports 80 and 443 must be open in the EC2 security
  # group). Until IV points a DNS name here, the default is the sslip.io name
  # for the Elastic IP, which resolves to it without any DNS change.
  caddy:
    image: caddy:2.8
    container_name: sarvam-caddy
    restart: always
    environment:
      - "SHILPI_DOMAIN=${SHILPI_DOMAIN:-13-206-20-25.sslip.io}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - open-webui
    logging: *default-logging

volumes:
  open-webui:
    external: true
    name: open-webui
  caddy_data:
  caddy_config:
